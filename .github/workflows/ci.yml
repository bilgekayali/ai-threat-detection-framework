name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile package
        run: python -m compileall -q src tools

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Evaluate full synthetic dataset
        if: matrix.python-version == '3.12'
        run: |
          ai-threat-eval \
            --data synthetic_alerts.csv \
            --output-dir /tmp/ai-threat-evidence
          test -s /tmp/ai-threat-evidence/evaluation_report.json
          test -s /tmp/ai-threat-evidence/evidence_manifest.json

      - name: Generate and evaluate a fresh scenario
        if: matrix.python-version == '3.12'
        run: |
          ai-threat-generate \
            --rows 1000 \
            --seed 42 \
            --out /tmp/generated-alerts.csv
          ai-threat-eval \
            --data /tmp/generated-alerts.csv \
            --output-dir /tmp/generated-evidence
          test -s /tmp/generated-evidence/evaluation_report.json
          test -s /tmp/generated-evidence/evidence_manifest.json
