[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-threat-detection-framework"
version = "1.0.0"
description = "Explainable alert-risk evaluation for synthetic security telemetry"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Bilge Kayalı" }]
keywords = [
  "cybersecurity",
  "threat-detection",
  "explainable-ai",
  "security-analytics",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "tomli>=2.0,<3; python_version < '3.11'",
]

[project.scripts]
ai-threat-eval = "ai_threat_detection.cli:main"
ai-threat-generate = "ai_threat_detection.generator:main"

[project.urls]
Repository = "https://github.com/bilgekayali/ai-threat-detection-framework"
LinkedIn = "https://www.linkedin.com/in/bilge-kayali-9a1232149/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=ai_threat_detection --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
